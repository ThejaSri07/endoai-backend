name: Comprehensive E2E Automated Test Suites

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  selenium-web-tests:
    name: Selenium — Website Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install exceljs selenium-webdriver

      - name: Run Selenium Website E2E Tests & Generate Excel
        run: |
          node tests/selenium_web/test_web_e2e.js

      - name: Upload Selenium Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: tests/selenium_web/Selenium_Website_Test_Report.xlsx

  appium-android-tests:
    name: Appium — Android Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install exceljs @wdio/appium-service webdriverio

      - name: Run Appium Android Mobile E2E Tests & Generate Excel
        run: |
          node tests/appium_mobile/test_mobile_appium.js

      - name: Upload Appium Mobile Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: tests/appium_mobile/Appium_Android_Test_Report.xlsx

  unit-api-tests:
    name: Unit Tests — API (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install exceljs

      - name: Run Unit & API Endpoint Tests & Generate Excel
        run: |
          node tests/unit_api/test_api_units.js

      - name: Upload Unit Test Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: tests/unit_api/Unit_API_Test_Report.xlsx

  validation-tests:
    name: Validation Tests (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install exceljs

      - name: Run Data & Security Validation Tests & Generate Excel
        run: |
          node tests/validation/test_validations.js

      - name: Upload Validation Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: tests/validation/Validation_Test_Report.xlsx

  deployment-status:
    name: Deployment Status (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install exceljs

      - name: Run Production Deployment Verification & Generate Excel
        run: |
          node tests/deployment/test_deployment.js

      - name: Upload Deployment Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: tests/deployment/Deployment_Status_Report.xlsx

  load-testing-performance:
    name: Load Testing — Performance (300)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install exceljs

      - name: Run Baseline Load Testing & Generate Excel
        run: |
          node tests/load_testing/test_load_baseline.js

      - name: Upload Load Test Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: tests/load_testing/Load_Performance_Test_Report.xlsx

  compile-master-report:
    name: Compile Master Report & Deploy
    needs: [selenium-web-tests, appium-android-tests, unit-api-tests, validation-tests, deployment-status, load-testing-performance]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install exceljs

      - name: Compile Master Multi-Sheet Excel Report (.xlsx)
        run: |
          node tests/run_all_tests.js

      - name: Upload Full Master E2E Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: "*.xlsx"
